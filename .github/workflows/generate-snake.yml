name: generate contribution snake

on:
  schedule:
    # Atualiza o snake a cada 12 horas
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: generate github-contribution-grid-snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff2d95&color_dots=#161b22,#3d1a2e,#7a2f5a,#c4457a,#ff2d95
            dist/github-contribution-grid-snake.gif?color_snake=#ff2d95&color_dots=#161b22,#3d1a2e,#7a2f5a,#c4457a,#ff2d95&color_background=#0d1117

      - name: push snake art to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
